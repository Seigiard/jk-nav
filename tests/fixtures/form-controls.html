<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Typing controls fixture</title>
    <style>
      body { margin: 0; min-height: 4000px; }
      form { display: grid; gap: 12px; padding: 24px; width: 320px; }
      [contenteditable] { border: 1px solid; min-height: 48px; }
    </style>
  </head>
  <body>
    <form>
      <button id="button" type="button">Button</button>
      <label><input id="checkbox" type="checkbox"> Checkbox</label>
      <label><input id="radio" type="radio" name="choice"> Radio</label>
      <label>Slider <input id="range" type="range"></label>
      <label>Search <input id="search" type="search"></label>
      <label>Text area <textarea id="textarea"></textarea></label>
      <div id="editable" contenteditable="true" aria-label="Editable content"></div>
      <label>
        Drop-down list
        <select id="select">
          <option value="alpha">Alpha</option>
          <option value="javascript">JavaScript</option>
          <option value="kotlin">Kotlin</option>
        </select>
      </label>
      <shadow-text-field></shadow-text-field>
    </form>
    <script>
      customElements.define('shadow-text-field', class extends HTMLElement {
        constructor() {
          super();
          const root = this.attachShadow({ mode: 'open' });
          const input = document.createElement('input');
          input.type = 'text';
          input.setAttribute('aria-label', 'Shadow text field');
          root.append(input);
        }
      });
    </script>
  </body>
</html>
